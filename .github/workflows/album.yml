name: Päivitä kuva-albumi
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: album
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/album.py kuvat.json
      - name: Commit jos muuttui
        run: |
          if [ -n "$(git status --porcelain kuvat.json)" ]; then
            git config user.name "albumibotti"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kuvat.json
            git commit -m "Albumin kuvat päivitetty"
            git push
          fi
